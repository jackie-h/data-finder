[project]
name = "data-finder-specs"
# Kept in step with data-finder: a test fails if the two versions differ.
version = "0.1.23"
description = "Language neutral specs for data-finder: example models, mappings, data and finder specs"
readme = "README.md"
license = { text = "Apache-2.0" }
classifiers = [
  "License :: OSI Approved :: Apache Software License"
]
requires-python = ">=3.11"
dependencies = []

# Data only: published as an sdist with no Python in it (`uv build --sdist`).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["pyproject.toml", "README.md", "examples", "specs"]
